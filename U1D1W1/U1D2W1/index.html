<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelle</title>
    <link rel="stylesheet"  href="assets/css/style.css">
</head>
<body>           
    

    <table>
        <caption>Elenco Persone</caption>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Età</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Nome</td>
            <td>Cognome</td>
            <td>Età</td>
        </tr>
        <tr>
            <td>Mario</td>
            <td>Rossi</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Luigi</td>
            <td>Bianchi</td>
            <td>25</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3">Totale Persone: 4</td>
        </tr>
        </tfoot>
    </table>


    <hr />

    <table>
        <thead>
        <tr>
            <th colspan="2">Nome</th>
            <th rowspan="2">Età</th>
        </tr>
        </thead>
        
        <tbody>
        <tr>
            <td>Mario</td>
            <td>Rossi</td>
            <td>30</td>
            <td>243535336</td>
        </tr>
        <tr>
            <td>Luigi</td>
            <td>Bianchi</td>
            <td>25</td>
            <td>243535336</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
